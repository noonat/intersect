<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="170" height="170">
    <rect id="background" x="0" y="0" width="100%" height="100%"/>
    <rect class="static quiet" x="35" y="35" width="100" height="100"/>
    <path class="static bad" d="M135,35 L135,60 A25,25 0 0 0 110,35 Z"/>
    <rect class="static-edge" x="35" y="35" width="100" height="100" rx="25"/>
    <rect class="static" x="60" y="60" width="50" height="50"/>
    <text class="static-text" text-anchor="middle" x="85" y="89">B</text>
    <circle class="static-edge" cx="132" cy="35" r="25"/>
    <text class="static-text" text-anchor="middle" x="132" y="26">A</text>
    <line class="segment" x1="120" y1="25" x2="150" y2="50"/>
    <defs>
        <style type="text/css"><![CDATA[
            #background {
                fill: #000;
            }
            #line-arrow {
                fill: #0ff;
            }
            #line-circle {
                fill: #0ff;
            }
            .segment {
                marker-start: url(#line-circle);
                marker-end: url(#line-arrow);
                stroke: #0ff;
                stroke-width: 2;
            }
            .static {
                fill-opacity: 0;
                stroke: #fff;
                stroke-width: 2;
            }
            .static-edge {
                fill-opacity: 0;
                stroke: #666;
                stroke-width: 2;
            }
            .static-text {
                fill: #fff;
                font-family: Arial;
                font-size: 12px;
            }
            .bad {
                fill: #f00;
                stroke: #f00;
            }
            .quiet {
                fill: #999;
                stroke: #999;
            }
        ]]></style>
        <marker id="line-arrow" orient="auto" markerWidth="3" markerHeight="6" refX="0.1" refY="3">
            <path d="M0,0 V6 L3,3 Z"/>
        </marker>
        <marker id="line-circle" orient="auto" markerWidth="4" markerHeight="4" refX="2" refY="2">
