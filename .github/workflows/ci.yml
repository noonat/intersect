name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` runs the `prepare` script, which builds the annotated docs,
      # the library, and the example bundle. Installing is therefore also a
      # build check.
      - run: npm ci

      - run: npm test

  # The tests above check that the library works on several versions of Node.
  # This job is a different question: whether the build output committed to
  # the repository is what the pinned toolchain actually produces. It uses the
  # same image as a local build, so the two can't disagree.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker build -f Containerfile -t intersect-build .

      - run: >
          docker run --rm -v "$PWD":/app -w /app
          --user "$(id -u):$(id -g)"
          intersect-build npm ci --no-audit --no-fund

      - name: Check committed build output is current
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Committed build output is stale."
            echo "Run 'npm run build:container' and commit the result."
            git status --short
            exit 1
          fi
