name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` runs the `prepare` script, which builds the annotated docs,
      # the library, and the example bundle. Installing is therefore also a
      # build check.
      - run: npm ci

      - run: npm test

  # The tests above check that the library works on several versions of Node.
  # This job is a different question: whether the build output committed to
  # the repository is what the build actually produces. It runs on a single
  # version of Node, because that is the claim being made.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check committed build output is current
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Committed build output is stale."
            echo "Run 'npm run build' and commit the result."
            git status --short
            exit 1
          fi

  # Whether the page still looks like the page. Kept out of the matrix above
  # because it is not a question about Node: it needs a browser, and the
  # baselines are images of one particular browser rendering the built page.
  #
  # The container is the same version @playwright/test is pinned to, so the
  # browser here is the binary the baselines were recorded with. Running this
  # on a bare runner would compare against a different Chromium, and every
  # antialiased edge would differ.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts skips the build, so the page under test is the one
      # committed to the repository. The job above is what checks that those
      # two are the same thing.
      - run: npm ci --ignore-scripts

      - run: npx playwright test

      # The report carries the expected, actual and diff images for anything
      # that failed, which is the only practical way to judge a difference
      # from here.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: visual-report
          path: test/visual/.report
          retention-days: 14
